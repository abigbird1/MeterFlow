server:
  port: 8080

spring:
  application:
    name: meterflow-gateway
  # 一体化交付：classpath:/static 托管 web/dist（SPA hash 路由仅请求 /，API 路由 /ingest /auth /t /a 优先匹配）
  webflux:
    static-path-pattern: /**
  cloud:
    nacos:
      discovery:
        enabled: true           # 服务注册（Nacos standalone 127.0.0.1:8848）（uri 同步改为 lb://服务名）
        server-addr: 127.0.0.1:8848
    sentinel:
      eager: true              # 启动即初始化（无 Dashboard 也能生效流控规则）
      transport:
        dashboard: 127.0.0.1:8858  # 可选：启动 Dashboard 后接入限流监控面板
    gateway:
      routes:
        # 事件上报 → billing（04 §1.2；限流口径 500 TPS）
        - id: ingest
          uri: lb://meterflow-billing
          predicates: [ "Path=/ingest/**" ]
        # 认证 → platform
        - id: auth
          uri: lb://meterflow-platform
          predicates: [ "Path=/auth/**" ]
        # 租户端：platform 承载（Key/组织/通知/个人）
        - id: t-platform
          uri: lb://meterflow-platform
          predicates: [ "Path=/t/api-keys/**,/t/org/**,/t/notifications/**,/t/profile/**" ]
        # 租户端：billing 承载（总览/钱包/账单/明细/实例/导出）
        - id: t-billing
          uri: lb://meterflow-billing
          predicates: [ "Path=/t/overview,/t/budget/**,/t/keys/**,/t/depts/**,/t/wallet/**,/t/usage-events/**,/t/package-instances/**,/t/exports/**" ]
        # 租户端：equity 承载（抢购/订单）
        - id: t-equity
          uri: lb://meterflow-equity
          predicates: [ "Path=/t/packages/**,/t/orders/**" ]
        # 租户端：finance 承载（争议）
        - id: t-finance
          uri: lb://meterflow-finance
          predicates: [ "Path=/t/disputes/**,/t/bills/**" ]
        # 管理端：platform 承载（看板/租户/账号/审计）
        - id: a-platform
          uri: lb://meterflow-platform
          predicates: [ "Path=/a/dashboard,/a/tenants/**,/a/platform-users/**,/a/audit-logs/**" ]
        # 管理端：billing 承载（产品计价/赠送额度）
        - id: a-billing
          uri: lb://meterflow-billing
          predicates: [ "Path=/a/products/**,/a/grants/**" ]
        # 管理端：equity 承载（商品/订单）
        - id: a-equity
          uri: lb://meterflow-equity
          predicates: [ "Path=/a/goods/**,/a/orders/**" ]
        # 管理端：finance 承载（账单/任务/欠费/对账/调整单/争议）
        - id: a-finance
          uri: lb://meterflow-finance
          predicates: [ "Path=/a/bills/**,/a/tasks/**,/a/debts/**,/a/recon/**,/a/adjustments/**,/a/disputes/**" ]

management:
  endpoints:
    web:
      exposure:
        include: health,info
