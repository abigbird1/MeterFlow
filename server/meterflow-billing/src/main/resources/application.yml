server:
  port: 8082

spring:
  application:
    name: meterflow-billing
  cloud:
    nacos:
      discovery:
        enabled: true           # 服务注册（Nacos standalone 127.0.0.1:8848）
        server-addr: 127.0.0.1:8848
      config:
        enabled: false
        server-addr: 127.0.0.1:8848
        file-extension: yml
  datasource:                     # 数据模型：meterflow_billing 库（04 schema-billing.sql）；ShardingSphere-JDBC 按月分表在数据落地阶段接入
    url: jdbc:mysql://127.0.0.1:3306/meterflow_billing?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: 127.0.0.1
      port: 6379

mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id          # 雪花 ID（规范 §3）
  configuration:
    map-underscore-to-camel-case: true


meterflow:
  platform-url: http://localhost:8081   # Key 上下文 Feign 直连（Nacos 启用后改为服务名发现）
  export-dir: ../deploy/data/exports    # 异步导出文件目录（AF2，保留 7 天）

management:
  health:
    redis:
      enabled: false   # Redis 不可达时健康降级（判重/预扣均有 DB 兜底）
  endpoints:
    web:
      exposure:
        include: health,info

# 设计基线 Java 21：开启虚拟线程（本机 JDK 17 骨架保持关闭）
# spring.threads.virtual.enabled: true
