# MeterFlow 中间件全家桶（03 v2.2 技术栈；应用服务在开发阶段逐步加入）
# 内存提示（R-9）：全量启动约需 10GB；本地可按 profile 分组启动（--profile dev 只起 mysql/redis）
version: "3.8"

services:
  mysql:
    image: mysql:8.0.36
    container_name: meterflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports: ["3306:3306"]
    volumes:
      - ../scripts/sql:/docker-entrypoint-initdb.d   # 四库建表 + 演示数据（z-data-demo.sql 在 schema 之后执行）
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.2
    container_name: meterflow-redis
    ports: ["6379:6379"]

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: meterflow-nacos
    environment:
      MODE: standalone
    ports: ["8848:8848", "9848:9848"]

  sentinel:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: meterflow-sentinel
    ports: ["8858:8858"]

  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: meterflow-namesrv
    command: ./mqnamesrv
    ports: ["9876:9876"]

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: meterflow-broker
    # brokerIP1 强制注册宿主可达地址（容器内网 IP 宿主机客户端不可达）
    command: sh -c "printf 'brokerIP1=127.0.0.1\nnamesrvAddr=meterflow-namesrv:9876\n' > /tmp/rmqsrv.conf && ./mqbroker -c /tmp/rmqsrv.conf"
    depends_on: [rocketmq-namesrv]
    ports: ["10911:10911", "10909:10909"]

  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: meterflow-es
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports: ["9200:9200"]

  kibana:
    image: kibana:8.13.4
    container_name: meterflow-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports: ["5601:5601"]
    depends_on: [elasticsearch]

  # XXL-Job Admin：任务面阶段接入（需先初始化 meterflow_xxljob 库与其官方表结构）
  # xxl-job-admin:
  #   image: xuxueli/xxl-job-admin:2.4.1
  #   container_name: meterflow-xxljob
  #   environment:
  #     PARAMS: '--spring.datasource.url=jdbc:mysql://mysql:3306/meterflow_xxljob?useUnicode=true&characterEncoding=UTF-8 --spring.datasource.username=root --spring.datasource.password=root'
  #   ports: ["8086:8086"]
  #   depends_on: [mysql]

volumes:
  mysql-data:
